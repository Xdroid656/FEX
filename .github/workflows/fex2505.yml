name: Compile FEXCore FEX-2505

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout FEX-2505 Source
      uses: actions/checkout@v4
      with:
        repository: 'FEX-Emu/FEX'
        ref: 'FEX-2505'
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git cmake ninja-build clang lld llvm nasm qt6-base-dev python3

    - name: Configure CMake
      run: |
        mkdir Build
        cd Build
        CC=clang CXX=clang++ cmake \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_BUILD_TYPE=Release \
          -DPython3_EXECUTABLE=/usr/bin/python3 \
          -DUSE_LINKER=lld \
          -DENABLE_LTO=False \
          -DBUILD_TESTS=False \
          -DBUILD_TESTING=False \
          -DENABLE_ASSERTIONS=False \
          -G Ninja ..

    - name: Compile Code
      run: |
        cd Build
        ninja -j"$(nproc)"
